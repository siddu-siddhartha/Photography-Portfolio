<!DOCTYPE html>
<html lang="en">
<head>
    <title>Photography Portfolio Registration</title>
</head>

<body style="margin:0; padding:0; font-family:Arial, Helvetica, sans-serif; background:linear-gradient(135deg,#6dd5ed,#2193b0); display:flex; justify-content:center; align-items:center; min-height:100vh;">

    <div style="background:white; width:400px; padding:30px; border-radius:10px; box-shadow:0 5px 15px gray;">

        <h1 style="text-align:center; color:#333;">
            Photography Portfolio Registration
        </h1>

        <form action="home.html">

            <label style="font-weight:bold;">Full Name:</label><br>
            <input
                type="text"
                name="fullname"
                style="width:100%; padding:10px; margin:5px 0 15px; border:1px solid #ccc; border-radius:5px; box-sizing:border-box;"
            >

            <label style="font-weight:bold;">Email:</label><br>
            <input
                type="email"
                name="email"
                style="width:100%; padding:10px; margin:5px 0 15px; border:1px solid #ccc; border-radius:5px; box-sizing:border-box;"
            >

            <label style="font-weight:bold;">Phone Number:</label><br>
            <input
                type="tel"
                name="phone"
                style="width:100%; padding:10px; margin:5px 0 15px; border:1px solid #ccc; border-radius:5px; box-sizing:border-box;"
            >

            <label style="font-weight:bold;">Password:</label><br>
            <input
                type="password"
                name="password"
                style="width:100%; padding:10px; margin:5px 0 15px; border:1px solid #ccc; border-radius:5px; box-sizing:border-box;"
            >

            <label style="font-weight:bold;">Confirm Password:</label><br>
            <input
                type="password"
                name="confirmpassword"
                style="width:100%; padding:10px; margin:5px 0 15px; border:1px solid #ccc; border-radius:5px; box-sizing:border-box;"
            >

            <label style="font-weight:bold;">Camera Brand:</label><br>
            <input
                type="text"
                name="camera"
                style="width:100%; padding:10px; margin:5px 0 15px; border:1px solid #ccc; border-radius:5px; box-sizing:border-box;"
            >

            <label style="font-weight:bold;">About Yourself:</label><br>
            <textarea
                name="about"
                rows="5"
                style="width:100%; padding:10px; margin:5px 0 20px; border:1px solid #ccc; border-radius:5px; box-sizing:border-box;"
            ></textarea>

            <input
                type="submit"
                value="Register"
                style="width:48%; padding:10px; background:#2193b0; color:white; border:none; border-radius:5px; cursor:pointer;"
            >

            <input
                type="reset"
                value="Clear"
                style="width:48%; padding:10px; background:gray; color:white; border:none; border-radius:5px; cursor:pointer; float:right;"
            >

        </form>

        <p style="text-align:center; margin-top:20px;">
            Already have an account?
            <a href="login.html" style="color:#2193b0; text-decoration:none; font-weight:bold;">
                Login
            </a>
        </p>

    </div>

</body>
</html>
