<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photography Portfolio</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="login">
    <div class="box">
        <h1>Photography Portfolio</h1>
        <input type="text" id="user" placeholder="Username">
        <input type="password" id="pass" placeholder="Password">

        <a href="#" onclick="alert('Forgot Password Page')">Forgot Password?</a>

        <button onclick="login()">Login</button>

        <p>Don't have an account?
            <a href="#" onclick="alert('Create Account Page')">Create Account</a>
        </p>
    </div>
</div>

<div id="dashboard">

<header>
<h2>📷 Photo Gallery</h2>
<nav>
<a href="#">Home</a>
<a href="#">Gallery</a>
<a href="#" onclick="logout()">Logout</a>
</nav>
</header>

<section class="hero">
<h1>Welcome Photographer</h1>
<p>Capture every beautiful moment.</p>
</section>

<section class="gallery">

<div class="card">
<img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSed9UqerK6mYPh6RUiz_JmmjCOIOq_IbepTxsRLiRWoBFVvxglIEUNTx4&s=10" alt="Nature">
<h3>Nature</h3>
</div>

<div class="card">
<img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTvPYN_nMaE3v-pEyALRB71_VAy6KYe_VMl40UoAljgpqdPrJSoaWzGrGM4&s=10" alt="Wildlife">
<h3>Wildlife</h3>
</div>

<div class="card">
<img  src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQreGwGZz0RtqOsvVRIsho9kD7YZuYdGf4z3jgSHPha7vvPLU4qTBfPXSaI&s=10" alt="Travel">
<h3>Travel</h3>
</div>

</section>
</div>

<script>
function login(){
let u=document.getElementById("user").value;
let p=document.getElementById("pass").value;

if(u!="" && p!=""){
document.getElementById("login").style.display="none";
document.getElementById("dashboard").style.display="block";
}
else{
alert("Enter Username and Password");
}
}

function logout(){
document.getElementById("dashboard").style.display="none";
document.getElementById("login").style.display="flex";
}
</script>

</body>
</html>
