<h1>Photography Catalogue</h1>

<h2>My Photographs</h2>

<input
    type="text"
    id="search"
    placeholder="Search category"
    onkeyup="searchPhotos()"
>

<div id="photos">

    <div>
        <img
            class="photo-thumb"
            src="https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=600"
            alt="Snow covered mountain peaks at sunrise"
        >
        <h3>Mountain</h3>
        <p>Nature Photography</p>
    </div>

    <div>
        <img
            class="photo-thumb"
            src="https://images.unsplash.com/photo-1474511320723-9a56873867b5?w=600"
            alt="A red fox standing in a snowy field"
        >
        <h3>Wildlife</h3>
        <p>Wildlife Photography</p>
    </div>

    <div>
        <img
            class="photo-thumb"
            src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=600"
            alt="Close up portrait of a smiling woman"
        >
        <h3>Portrait</h3>
        <p>Portrait Photography</p>
    </div>

    <div>
        <img
            class="photo-thumb"
            src="https://images.unsplash.com/photo-1488646953014-85cb44e25828?w=600"
            alt="A traveller looking out over a city street"
        >
        <h3>Travel</h3>
        <p>Travel Photography</p>
    </div>

</div>
