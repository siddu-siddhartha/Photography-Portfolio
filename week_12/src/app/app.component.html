<!-- Interpolation: {{ }} -->
<h1>{{ title }}</h1>

<div class="ajax-container">
  <h2>Week 12 Demo</h2>
  <p>Photographer: <b>{{ photographer }}</b></p>

  <!-- Two-way binding: [(ngModel)] -->
  <input type="text" [(ngModel)]="searchText" placeholder="Search category">
  <p>You typed: {{ searchText }}</p>

  <!-- Event binding: (click) -->
  <button (click)="togglePrices()">
    {{ showPrices ? 'Hide Prices' : 'Show Prices' }}
  </button>

  <p>Total likes: {{ likes }}</p>
  <!-- *ngIf shows this line only after a photo is liked -->
  <p *ngIf="lastLiked">Last liked: {{ lastLiked }}</p>
</div>

<div class="photo-container">
  <!-- *ngFor repeats the child component for every photo -->
  <!-- Property binding [photo] sends data DOWN, event (liked) sends data UP -->
  <app-photo-card
    *ngFor="let p of filteredPhotos()"
    [photo]="p"
    [showPrice]="showPrices"
    (liked)="onLiked($event)">
  </app-photo-card>
</div>

<p *ngIf="filteredPhotos().length === 0">No photos found.</p>
