<!DOCTYPE html>
<html lang="en">
<head>
    <title>Photography Portfolio Registration</title>
</head>
<body>

    <h1>Photography Portfolio Registration</h1>

    <form action="home.html">

        <label>Full Name:</label><br>
        <input type="text" name="fullname"><br><br>

        <label>Email:</label><br>
        <input type="email" name="email"><br><br>

        <label>Phone Number:</label><br>
        <input type="tel" name="phone"><br><br>

        <label>Password:</label><br>
        <input type="password" name="password"><br><br>

        <label>Confirm Password:</label><br>
        <input type="password" name="confirmpassword"><br><br>

        <label>Camera Brand:</label><br>
        <input type="text" name="camera"><br><br>

        <label>About Yourself:</label><br>
        <textarea name="about" rows="5" cols="30"></textarea><br><br>

        <input type="submit" value="Register">
        <input type="reset" value="Clear">

    </form>

    <p>
        Already have an account?
        <a href="login.html">Login</a>
    </p>

</body>
</html>
