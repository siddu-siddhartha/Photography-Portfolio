<!DOCTYPE html>
<html>
<head>
    <title>Registration - LensFolio</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="../week_3/style.css">
</head>

<body>


<header class="site-header">
    <a class="brand" href="../week_1/home.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M3 8.5h3.2L8 6h8l1.8 2.5H21V19H3z"/><circle cx="12" cy="13.2" r="3.8"/><circle cx="12" cy="13.2" r="1.6"/></svg>
        LensFolio
    </a>

    <nav>
        <a href="../week_1/home.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M10 21v-6h4v6"/></svg><span class="nav-label">Home</span></a>
        <a href="../week_2/register.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.3-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><path d="M19 8v6M16 11h6"/></svg><span class="nav-label">Registration</span></a>
        <a href="mod_register.html" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.3-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><path d="m16 11 2 2 4-4"/></svg><span class="nav-label">Validated Registration</span></a>
    </nav>
</header>

<h1>Join LensFolio</h1>

<div class="form-container">

    <h2>Registration</h2>

    <form onsubmit="return validateForm()">

        <label>Name:</label>
        <input type="text" id="name">

        <label>Email:</label>
        <input type="text" id="email">

        <label>Phone:</label>
        <input type="text" id="phone">

        <label>Password:</label>
        <input type="password" id="password">

        <label>Confirm Password:</label>
        <input type="password" id="confirmPassword">

        <label>Photography Interest:</label>

        <select id="interest">
            <option value="">Select</option>
            <option>Nature</option>
            <option>Wildlife</option>
            <option>Portrait</option>
            <option>Travel</option>
        </select>

        <input type="submit" value="Register">

    </form>

    <p>
        Already registered?
        <a href="../week_1/login.html">Login</a>
    </p>

</div>

<script src="validation.js"></script>

</body>
</html>
