<!DOCTYPE html>
<html>
<head>
    <title>Registration - LensFolio</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="../week_3/style.css">
</head>

<body>


<header class="site-header">
    <a class="brand" href="../week_1/home.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M3 8.5h3.2L8 6h8l1.8 2.5H21V19H3z"/><circle cx="12" cy="13.2" r="3.8"/><circle cx="12" cy="13.2" r="1.6"/></svg>
        LensFolio
    </a>

    <nav>
        <a href="../week_1/home.html">Home</a>
        <a href="../week_2/register.html">Registration</a>
        <a href="mod_register.html">Validated Registration</a>
    </nav>
</header>

<h1>Join LensFolio</h1>

<div class="form-container">

    <h2>Registration</h2>

    <form onsubmit="return validateForm()">

        <label>Name:</label>
        <input type="text" id="name">

        <label>Email:</label>
        <input type="text" id="email">

        <label>Phone:</label>
        <input type="text" id="phone">

        <label>Password:</label>
        <input type="password" id="password">

        <label>Confirm Password:</label>
        <input type="password" id="confirmPassword">

        <label>Photography Interest:</label>

        <select id="interest">
            <option value="">Select</option>
            <option>Nature</option>
            <option>Wildlife</option>
            <option>Portrait</option>
            <option>Travel</option>
        </select>

        <input type="submit" value="Register">

    </form>

    <p>
        Already registered?
        <a href="../week_1/login.html">Login</a>
    </p>

</div>

<script src="validation.js"></script>

</body>
</html>
