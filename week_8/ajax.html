<h1>About LensFolio</h1>

<div class="ajax-container">

    <h2>Load Text Data Asynchronously</h2>

    <button onclick="loadText()">Load Photographer Information</button>

</div>

<div id="result" style="white-space: pre-line;"></div>

<script>

function loadText() {

    fetch("message.txt")

        .then(response => {

            if (!response.ok) {
                throw new Error("Network error: " + response.status);
            }

            return response.text();
        })

        .then(data => {
            document.getElementById("result").innerText = data;
        })

        .catch(error => {
            document.getElementById("result").innerText =
                "Error: " + error.message;
        });
}

</script>
