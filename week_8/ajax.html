<!DOCTYPE html>
<html>
<head>
    <title>AJAX Text Example</title>
</head>
<body>
<link rel="stylesheet" href="../week_3/style.css">
<h1>Photography Portfolio</h1>

<button onclick="loadText()">Load Photographer Information</button>

<p id="result"></p>

<script>

function loadText() {

    fetch("message.txt")
        .then(response => response.text())
        .then(data => {
            document.getElementById("result").innerText = data;
        })
        .catch(error => {
            document.getElementById("result").innerText = "Error loading data";
        });
}

</script>

</body>
</html>
