<h2>My Bookings</h2>

<p *ngIf="bookings.length === 0">
  No bookings yet. <a routerLink="/book">Book a shoot</a>
</p>

<div class="photographer-container">
  <div class="photographer-card" *ngFor="let b of bookings">
    <h3>{{ b.name }}</h3>
    <p>{{ b.email }}</p>
    <p><b>{{ b.category }}</b> on {{ b.date }}</p>
    <p *ngIf="b.message">"{{ b.message }}"</p>
  </div>
</div>
