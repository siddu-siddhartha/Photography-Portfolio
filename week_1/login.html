<!DOCTYPE html>
<html>
<head>
    <title>Login - Photography Portfolio</title>

    <!-- External CSS (Week 3) -->
    <link rel="stylesheet" href="../week_3/style.css">

    <!-- Internal CSS (Week 3) -->
    <style>
        .login-container {
            border-top: 4px solid #f59e0b;
        }

        .tagline {
            color: #64748b;
            font-style: italic;
        }
    </style>
</head>

<body>

<h1>Online Photography Portfolio</h1>

<hr>

<!-- Inline CSS (Week 3) -->
<p class="tagline" style="margin-top: 18px;">
    Capturing moments, one frame at a time.
</p>

<div class="login-container">

    <h2>Login</h2>

    <form action="home.html">

        <label>Email:</label>
        <input type="email" id="email" required>

        <label>Password:</label>
        <input type="password" id="password" required>

        <input type="submit" value="Login">

    </form>

    <p>
        Don't have an account?
        <a href="../week_2/register.html">Register</a>
    </p>

</div>

</body>
</html>
