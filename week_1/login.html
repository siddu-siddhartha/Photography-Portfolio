<!DOCTYPE html>
<html>
<head>
    <title>Login - LensFolio</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- External CSS (Week 3) -->
    <link rel="stylesheet" href="../week_3/style.css">

    <!-- Internal CSS (Week 3) -->
    <style>
        .login-container {
            border-top: 2px solid #b6a6ff;
        }

        .tagline {
            color: #9b9aa3;
            font-style: italic;
        }
    </style>
</head>

<body class="auth-page">

<h1>LensFolio</h1>

<!-- Inline CSS (Week 3) -->
<p class="tagline" style="margin-top: 4px; letter-spacing: 1px;">
    Capturing moments, one frame at a time.
</p>

<div class="login-container">

    <h2>Login</h2>

    <form action="home.html">

        <label>Email:</label>
        <input type="email" id="email" required>

        <label>Password:</label>
        <input type="password" id="password" required>

        <input type="submit" value="Login">

    </form>

    <p>
        Don't have an account?
        <a href="../week_2/register.html">Register</a>
    </p>

</div>

</body>
</html>
